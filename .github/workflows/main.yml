name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          FILE=$(find . -maxdepth 4 -name pubspec.yaml \
            -not -path '*/.dart_tool/*' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Flutter project: $DIR"

      - name: Repair Android project files
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "Creating missing Android platform files..."
            flutter create --platforms=android .
          fi

          if [ ! -f android/app/build.gradle ] && \
             [ ! -f android/app/build.gradle.kts ]; then
            echo "ERROR: Android Gradle files are still missing"
            exit 1
          fi

      - name: Get dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Check Dart code
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter analyze --no-pub

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alriyadh-Factory-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7